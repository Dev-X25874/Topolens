[package]
name = "topolens"
version = "0.1.0"
edition = "2021"
description = "Reads NUMA/PCIe topology from sysfs and recommends CPU-to-accelerator pinning"
license = "MPL-2.0"

[lib]
name = "topolens"
path = "src/lib.rs"

[[bin]]
name = "topolens"
path = "src/bin/topolens.rs"

# Deliberately zero external dependencies: this is meant to run on hosts
# where you don't want cargo pulling half of crates.io just to read sysfs.
[dependencies]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
